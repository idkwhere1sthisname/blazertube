	<head>
		<style>
			body {
				margin: 0px;
			}
			.mvLegend {
				width: 96px;
				height: 32px;
				position: absolute;
			}
		</style>
		<script>
			var _currentVID = setParams(vod.getMiiverseLink()).videoURL;
			var mvViewIsUp = false;
			function setParams(commonString) {
				var ret = {};
				try {
					ret.videoURL = commonString.split('&post_id=')[0];
					ret.mvID = commonString.split('&post_id=')[1];
					return ret;
				} catch(e) {}
			}
			function handleKeyDown(e) {
				if(e.keyCode === 123) {
					goToMV(vod.getMiiverseLink());
				}
			}
			function handleMouseDown() {
				var params = setParams(params);
				goToMV(params);
			}
			function mvParamChange(e) {
				var param = e.data.param;
				var params = setParams(param);
				if(params.mvID && !mvViewIsUp) {
					vod.getView().show();
					mvViewIsUp = true;
				}
				if(params.videoURL && params.videoURL !== _currentVID) {
					var fullURL = '{{host}}/watch?'+params.videoURL;
					vod.getView().getOpener().getWindow().open(fullURL,'_self');
					_currentVID = params.videoURL;
				}
			}
			function goToMV(params) {
				var params = setParams(params);
				vod.setMiiverseLink(params.mvID);
				vod.launchMiiverse();
			}
			window.onload = function() {
				window.addEventListener('keydown',handleKeyDown);
				vod.addEventListener('miiverse_param_changed',mvParamChange);
				vod.ready();
				var params = setParams(vod.getMiiverseLink());
				if(params.mvID) {
					vod.getView().show();
					mvViewIsUp = true;
				}
			};
		</script>
	</head>
